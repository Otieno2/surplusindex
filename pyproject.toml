[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surplusindex"
version = "0.1.0"
description = "Automated liquidation price tracker and static site generator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "playwright>=1.40",
    "Jinja2>=3.1",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "click>=8.1",
    "pyyaml>=6.0",
    "schedule>=1.2",
    "fake-useragent>=1.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "mypy>=1.7",
    "pytest>=7.4",
]

[project.scripts]
surplusindex = "main:cli"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["."]
